<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Zerofuss</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #0a0c0f;
    color: #e7ecf3;
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    user-select: none;
    cursor: default;
  }
  .wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    /* Garis tipis putih transparan, bukan abu bernada. */
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
  }
  /* Lockup dipakai di sini, bukan di bar atas: di sini ada ruang, dan glyph
     line-art logo terukur jadi noda di bawah 32 px. Bar atas tetap memakai
     tanda SVG - tajam di segala ukuran dan ikut warna tema. */
  .lockup {
    width: 340px;
    display: block;
    animation: in 520ms cubic-bezier(0.2, 0, 0, 1) backwards;
  }
  .sub {
    font-size: 12.5px;
    color: #8a94a3;
    text-align: center;
    text-wrap: balance;
    animation: in 520ms cubic-bezier(0.2, 0, 0, 1) 180ms backwards;
  }
  /* Batang tak-tentu: lamanya start tidak bisa diketahui, jadi jangan pura-pura
     tahu persentasenya. */
  .bar {
    width: 168px;
    height: 3px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.09);
    overflow: hidden;
    animation: in 520ms cubic-bezier(0.2, 0, 0, 1) 260ms backwards;
  }
  .bar i {
    display: block;
    width: 40%;
    height: 100%;
    border-radius: 999px;
    background: #38bdf8;
    animation: slide 1.1s cubic-bezier(0.4, 0, 0.6, 1) infinite;
  }
  @keyframes in { from { opacity: 0; translate: 0 8px; } }
  @keyframes slide { from { translate: -100% 0; } to { translate: 250% 0; } }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 1ms !important; }
    .bar i { width: 100%; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <img class="lockup" src="lockup.png" alt="Zerofuss" />
    <p class="sub">Live view goggles DJI di desktop, lewat kabel USB</p>
    <div class="bar"><i></i></div>
  </div>
</body>
</html>
